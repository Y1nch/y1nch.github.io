<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理後台 - Yinch 的作品集</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
    <style>
        body {
            font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto;
            background: linear-gradient(180deg, #071029 0%, #0b1220 60%);
            color: #e6eef8;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #0b0f19;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #3b82f6;
        }

        .logo-text {
            color: #ffffff;
            font-weight: bold;
            font-size: 1.1rem;
            text-decoration: none;
        }

        .logo-sub {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-right: 6px;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 30px;
            align-items: center;
        }

        nav ul li a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s ease;
            font-weight: 600;
        }

        nav ul li a:hover,
        nav ul li a.active {
            color: #ffffff;
        }

        main {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .dashboard-container {
            background-color: #111827;
            border: 1px solid rgba(59, 130, 246, 0.2);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        h2 {
            font-size: 1.8rem;
            margin-top: 0;
            margin-bottom: 24px;
            border-bottom: 2px solid #3b82f6;
            padding-bottom: 8px;
            color: #ffffff;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            text-align: left;
        }

        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        th {
            background-color: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
            font-weight: 600;
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .role-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .role-admin {
            background-color: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        .role-user {
            background-color: rgba(148, 163, 184, 0.2);
            color: #94a3b8;
            border: 1px solid rgba(148, 163, 184, 0.4);
        }

        .action-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .action-btn:hover {
            background-color: #2563eb;
        }

        .action-btn:active {
            transform: scale(0.97);
        }

        .action-btn.demote {
            background-color: #ef4444;
        }

        .action-btn.demote:hover {
            background-color: #dc2626;
        }

        .unauthorized-msg {
            text-align: center;
            padding: 50px 20px;
        }

        .unauthorized-msg h3 {
            color: #ef4444;
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        .unauthorized-msg p {
            color: #94a3b8;
            margin-bottom: 25px;
        }

        .avatar-cell {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-table-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid #3b82f6;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-section">
            <img class="logo-avatar" src="https://github.com/Y1nch.png" alt="Avatar">
            <a href="index.html" class="logo-text"><span class="logo-sub">只是個人</span>@Yinch</a>
        </div>
        <nav>
            <ul id="nav-list">
                <li><a href="index.html">關於我</a></li>
                <li><a href="index.html#games">遊戲清單</a></li> 
                <li><a href="videos.html">影片</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div id="admin-content" style="display: none;">
            <div class="dashboard-container">
                <h2>帳號管理與權限指派</h2>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>使用者</th>
                                <th>建立時間</th>
                                <th>目前權限</th>
                                <th>權限管理</th>
                            </tr>
                        </thead>
                        <tbody id="user-table-body">
                            <!-- 動態載入帳號列表 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="unauthorized-content" style="display: none;">
            <div class="unauthorized-msg">
                <h3>⚠️ 存取被拒絕</h3>
                <p>您不具備管理員權限，或登入工作階段已過期。請以管理員帳號登入後再試。</p>
                <a href="login.html" class="btn btn-primary" style="display: inline-block;">前往登入頁面</a>
            </div>
        </div>
    </main>

    <script>
        const BACKEND_URL = "https://y1nchgithubio-production.up.railway.app";

        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                return JSON.parse(jsonPayload);
            } catch (e) {
                return null;
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('token');
            const payload = token ? parseJwt(token) : null;
            const navUl = document.getElementById('nav-list');

            // 1. 導覽列狀態切換與頭像
            if (token && navUl) {
                const payload = parseJwt(token);
                if (payload && payload.username) {
                    const avatarUrl = `https://api.dicebear.com/7.x/pixel-art/svg?seed=${encodeURIComponent(payload.username)}`;
                    const avatarLi = document.createElement('li');
                    avatarLi.style.display = 'flex';
                    avatarLi.style.alignItems = 'center';
                    
                    const avatarImg = document.createElement('img');
                    avatarImg.src = avatarUrl;
                    avatarImg.alt = payload.username;
                    avatarImg.title = payload.username;
                    avatarImg.style.width = '32px';
                    avatarImg.style.height = '32px';
                    avatarImg.style.borderRadius = '50%';
                    avatarImg.style.border = '2px solid #3b82f6';
                    
                    avatarLi.appendChild(avatarImg);
                    navUl.appendChild(avatarLi);
                }

                if (payload && payload.role === 'admin') {
                    const adminLi = document.createElement('li');
                    adminLi.innerHTML = `<a href="admin.html" class="active">管理後台</a>`;
                    navUl.appendChild(adminLi);
                }

                const logoutLi = document.createElement('li');
                const logoutBtn = document.createElement('a');
                logoutBtn.href = '#';
                logoutBtn.textContent = '登出';
                logoutBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    localStorage.removeItem('token');
                    alert('已成功登出！');
                    window.location.href = 'index.html';
                });
                logoutLi.appendChild(logoutBtn);
                navUl.appendChild(logoutLi);
            } else if (navUl) {
                navUl.innerHTML += `
                    <li><a href="login.html">登入</a></li>
                    <li><a href="register.html">註冊</a></li>
                `;
            }

            // 2. 權限認證檢查與資料加載
            if (!payload || payload.role !== 'admin') {
                document.getElementById('unauthorized-content').style.display = 'block';
                return;
            }

            document.getElementById('admin-content').style.display = 'block';
            await loadUsers();
        });

        async function loadUsers() {
            const token = localStorage.getItem('token');
            try {
                const response = await fetch(`${BACKEND_URL}/api/auth/users`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const users = await response.json();
                    const tbody = document.getElementById('user-table-body');
                    tbody.innerHTML = '';

                    users.forEach(user => {
                        const tr = document.createElement('tr');
                        const avatarUrl = `https://api.dicebear.com/7.x/pixel-art/svg?seed=${encodeURIComponent(user.username)}`;
                        
                        const isMainAdmin = user.username === 'Yinch';

                        tr.innerHTML = `
                            <td>
                                <div class="avatar-cell">
                                    <img src="${avatarUrl}" class="user-table-avatar" alt="">
                                    <strong>${user.username}</strong>
                                </div>
                            </td>
                            <td>${new Date(user.created_at).toLocaleString()}</td>
                            <td>
                                <span class="role-badge ${user.role === 'admin' ? 'role-admin' : 'role-user'}">
                                    ${user.role === 'admin' ? '管理員' : '一般用戶'}
                                </span>
                            </td>
                            <td>
                                ${isMainAdmin 
                                    ? `<em style="color: #64748b; font-size: 0.9rem;">系統主要管理員</em>` 
                                    : `<button class="action-btn ${user.role === 'admin' ? 'demote' : ''}" onclick="toggleRole(${user.id}, '${user.role}')">
                                        ${user.role === 'admin' ? '降級為用戶' : '設為管理員'}
                                       </button>`
                                }
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    document.getElementById('admin-content').style.display = 'none';
                    document.getElementById('unauthorized-content').style.display = 'block';
                }
            } catch (error) {
                console.error('載入帳號失敗:', error);
                alert('伺服器連線失敗，無法取得帳號清單。');
            }
        }

        async function toggleRole(userId, currentRole) {
            const token = localStorage.getItem('token');
            const newRole = currentRole === 'admin' ? 'user' : 'admin';
            const actionText = newRole === 'admin' ? '指派為管理員' : '移除管理員權限';

            if (!confirm(`確定要將此帳號${actionText}嗎？`)) return;

            try {
                const response = await fetch(`${BACKEND_URL}/api/auth/users/${userId}/role`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ role: newRole })
                });

                if (response.ok) {
                    alert('權限更新成功！');
                    await loadUsers();
                } else {
                    const errorText = await response.text();
                    alert(`權限變更失敗: ${errorText}`);
                }
            } catch (error) {
                console.error('變更權限失敗:', error);
                alert('變更失敗，請檢查網路。');
            }
        }
    </script>
</body>
</html>
