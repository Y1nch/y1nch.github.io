<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>註冊</title>
    <link rel="stylesheet" href="styles/main.css">
    <style>
        /* 🎨 註冊頁專屬高級深色賽博風格樣式 */
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 導覽列優化：對接主體質感 */
        header {
            background: rgba(13, 18, 30, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(59, 130, 246, 0.1);
            padding: 18px 5%;
        }

        header nav {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 24px;
            max-width: 1200px;
            margin: 0 auto;
        }

        header nav a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        header nav a:hover {
            color: #3b82f6;
            text-shadow: 0 0 8px rgba(59, 130, 246, 0.5);
        }

        /* 註冊卡片置中佈局 */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .register-card {
            background: linear-gradient(145deg, #111827, #0f172a);
            border: 1px solid rgba(59, 130, 246, 0.15);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }

        h1 {
            margin: 0 0 30px 0;
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 表單元素美化 */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        label {
            color: #94a3b8;
            font-size: 0.9rem;
            font-weight: 500;
        }

        input {
            background-color: #070a13;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 12px 16px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            width: 100%;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.25);
        }

        /* 按鈕紫色極光特效 (與登入做微幅區隔) */
        button[type="submit"] {
            background: linear-gradient(135deg, #a855f7, #6366f1);
            border: none;
            border-radius: 8px;
            color: #ffffff;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            margin-top: 10px;
            padding: 14px;
            width: 100%;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button[type="submit"]:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.4);
        }

        button[type="submit"]:active {
            transform: translateY(1px);
        }

        #message {
            text-align: center;
            font-size: 0.9rem;
            margin-top: 15px;
            min-height: 20px;
        }

        footer {
            text-align: center;
            padding: 24px;
            color: #475569;
            font-size: 0.85rem;
            border-top: 1px solid rgba(255, 255, 255, 0.02);
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">首頁</a>
            <a href="videos.html">影片</a>
            <a href="register.html">註冊</a>
            <a href="login.html">登入</a>
        </nav>
    </header>
    <main>
        <div class="register-card">
            <h1>建立新帳號</h1>
            <form id="registerForm">
                <div class="form-group">
                    <label for="username">用戶名</label>
                    <input type="text" id="username" name="username" placeholder="請輸入欲註冊的使用者名稱" required>
                </div>
                <div class="form-group">
                    <label for="password">密碼</label>
                    <input type="password" id="password" name="password" placeholder="請輸入密碼" required>
                </div>
                <button type="submit">確認註冊</button>
            </form>
            <p id="message"></p>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 精華分享網站</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            const nav = document.querySelector('header nav');
            
            function parseJwt(token) {
                try {
                    const base64Url = token.split('.')[1];
                    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                    const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                    }).join(''));
                    return JSON.parse(jsonPayload);
                } catch (e) {
                    return null;
                }
            }

            if (token && nav) {
                const loginLink = nav.querySelector('a[href="login.html"]');
                const registerLink = nav.querySelector('a[href="register.html"]');
                if (loginLink) loginLink.remove();
                if (registerLink) registerLink.remove();
                
                const payload = parseJwt(token);
                if (payload && payload.username) {
                    const avatarUrl = `https://api.dicebear.com/7.x/pixel-art/svg?seed=${encodeURIComponent(payload.username)}`;
                    const avatarImg = document.createElement('img');
                    avatarImg.src = avatarUrl;
                    avatarImg.alt = payload.username;
                    avatarImg.title = payload.username;
                    avatarImg.style.width = '32px';
                    avatarImg.style.height = '32px';
                    avatarImg.style.borderRadius = '50%';
                    avatarImg.style.border = '2px solid #3b82f6';
                    avatarImg.style.verticalAlign = 'middle';
                    avatarImg.style.marginLeft = '18px';
                    nav.appendChild(avatarImg);
                }
                
                const logoutBtn = document.createElement('a');
                logoutBtn.href = '#';
                logoutBtn.textContent = '登出';
                logoutBtn.style.marginLeft = '18px';
                logoutBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    localStorage.removeItem('token');
                    alert('已成功登出！');
                    window.location.reload();
                });
                nav.appendChild(logoutBtn);
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('https://y1nchgithubio-production.up.railway.app/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                const messageElement = document.getElementById('message');
                if (response.ok) {
                    messageElement.style.color = '#10b981'; // 質感翠綠
                    messageElement.textContent = '註冊成功！正在跳轉至登入頁面...';
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);
                } else {
                    const errorData = await response.text();
                    messageElement.style.color = '#ef4444'; // 警告赤紅
                    messageElement.textContent = `註冊失敗: ${errorData}`;
                }
            } catch (error) {
                console.error('錯誤:', error);
                document.getElementById('message').style.color = '#ef4444';
                document.getElementById('message').textContent = '伺服器連接錯誤。';
            }
        });
    </script>
</body>
</html>
