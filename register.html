<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>註冊</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html">首頁</a>
            <a href="videos.html">影片</a>
            <a href="register.html">註冊</a>
            <a href="login.html">登入</a>
        </nav>
    </header>
    <main>
        <h1>註冊</h1>
        <form id="registerForm">
            <label for="username">用戶名:</label>
            <input type="text" id="username" name="username" required>
            <label for="password">密碼:</label>
            <input type="password" id="password" name="password" required>
            <button type="submit">註冊</button>
        </form>
        <p id="message"></p>
    </main>
    <footer>
        <p>&copy; 2026 精華分享網站</p>
    </footer>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            const nav = document.querySelector('header nav');
            
            function parseJwt(token) {
                try {
                    const base64Url = token.split('.')[1];
                    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                    const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                    }).join(''));
                    return JSON.parse(jsonPayload);
                } catch (e) {
                    return null;
                }
            }

            if (token && nav) {
                const loginLink = nav.querySelector('a[href="login.html"]');
                const registerLink = nav.querySelector('a[href="register.html"]');
                if (loginLink) loginLink.remove();
                if (registerLink) registerLink.remove();
                
                const payload = parseJwt(token);
                if (payload && payload.username) {
                    const avatarUrl = `https://api.dicebear.com/7.x/pixel-art/svg?seed=${encodeURIComponent(payload.username)}`;
                    const avatarImg = document.createElement('img');
                    avatarImg.src = avatarUrl;
                    avatarImg.alt = payload.username;
                    avatarImg.title = payload.username;
                    avatarImg.style.width = '32px';
                    avatarImg.style.height = '32px';
                    avatarImg.style.borderRadius = '50%';
                    avatarImg.style.border = '2px solid #3b82f6';
                    avatarImg.style.verticalAlign = 'middle';
                    avatarImg.style.marginLeft = '18px';
                    nav.appendChild(avatarImg);
                }
                
                const logoutBtn = document.createElement('a');
                logoutBtn.href = '#';
                logoutBtn.textContent = '登出';
                logoutBtn.style.marginLeft = '18px';
                logoutBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    localStorage.removeItem('token');
                    alert('已成功登出！');
                    window.location.reload();
                });
                nav.appendChild(logoutBtn);
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                // 自動使用相對路徑，或是改用您 Railway 部署的 API URL（如果 GitHub Pages 與 API 不同網域）
                const response = await fetch('https://y1nchgithubio-production.up.railway.app/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                const messageElement = document.getElementById('message');
                if (response.ok) {
                    messageElement.style.color = 'green';
                    messageElement.textContent = '註冊成功！您現在可以登入了。';
                    window.location.href = 'login.html';
                } else {
                    const errorData = await response.text();
                    messageElement.style.color = 'red';
                    messageElement.textContent = `註冊失敗: ${errorData}`;
                }
            } catch (error) {
                console.error('錯誤:', error);
                document.getElementById('message').style.color = 'red';
                document.getElementById('message').textContent = '伺服器連接錯誤。';
            }
        });
    </script>
</body>
</html>
