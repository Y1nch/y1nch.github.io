<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影片圖像分享</title>
    <link rel="stylesheet" href="styles/main.css">
    <style>
        /* 保持原有樣式不變 */
        .user-role-badge {
            font-size: 0.7rem;
            color: #94a3b8;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>
    <!-- 保持原有HTML結構不變 -->

    <script src="scripts/videos.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('token');
            const navUl = document.querySelector('nav ul');
            const BACKEND_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
                ? 'http://localhost:3000'
                : 'https://y1nchgithubio-production.up.railway.app';
            
            function parseJwt(token) {
                try {
                    const base64Url = token.split('.')[1];
                    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                    const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                    }).join(''));
                    return JSON.parse(jsonPayload);
                } catch (e) {
                    return null;
                }
            }

            if (token && navUl) {
                // 處理登入狀態
                const loginLink = navUl.querySelector('a[href="login.html"]');
                const registerLink = navUl.querySelector('a[href="register.html"]');
                
                if (loginLink) {
                    const loginLi = loginLink.closest('li');
                    if (loginLi) loginLi.remove();
                }
                if (registerLink) {
                    const registerLi = registerLink.closest('li');
                    if (registerLi) registerLi.remove();
                }
                
                const payload = parseJwt(token);
                if (payload && payload.username) {
                    const avatarContainer = document.createElement('div');
                    avatarContainer.style.display = 'flex';
                    avatarContainer.style.alignItems = 'center';
                    avatarContainer.style.gap = '10px';
                    
                    const avatarImg = document.createElement('img');
                    avatarImg.alt = payload.username;
                    avatarImg.title = `${payload.username} (點擊可上傳/更換頭像)`;
                    avatarImg.style.width = '32px';
                    avatarImg.style.height = '32px';
                    avatarImg.style.borderRadius = '50%';
                    avatarImg.style.border = '2px solid #3b82f6';
                    avatarImg.style.cursor = 'pointer';
                    avatarImg.style.transition = 'transform 0.2s';
                    avatarImg.onmouseover = () => avatarImg.style.transform = 'scale(1.15)';
                    avatarImg.onmouseout = () => avatarImg.style.transform = 'scale(1)';
                    
                    const userInfo = document.createElement('div');
                    userInfo.style.display = 'flex';
                    userInfo.style.flexDirection = 'column';
                    
              const roleBadge = document.createElement('span');
              roleBadge.className = 'user-role-badge';
              roleBadge.textContent = payload.username === 'Yinch' ? '伺服器/網頁代理' : (payload.role === 'admin' ? '管理員' : '使用者');
                    
                    const usernameText = document.createElement('span');
                    usernameText.style.fontWeight = '600';
                    usernameText.textContent = payload.username;
                    
                    userInfo.appendChild(roleBadge);
                    userInfo.appendChild(usernameText);
                    avatarContainer.appendChild(avatarImg);
                    avatarContainer.appendChild(userInfo);

                    // 獲取最新Profile頭像
                    let finalAvatarUrl = `https://api.dicebear.com/7.x/pixel-art/svg?seed=${encodeURIComponent(payload.username)}`;
                    try {
                        const profileRes = await fetch(`${BACKEND_URL}/api/auth/profile`, {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        if (profileRes.ok) {
                            const profileData = await profileRes.json();
                            if (profileData.avatar) {
                                finalAvatarUrl = `${BACKEND_URL}/uploads/${profileData.avatar}`;
                            }
                        }
                    } catch (err) {
                        console.error('獲取頭像失敗，使用預設頭像:', err);
                    }
                    avatarImg.src = finalAvatarUrl;

                    // 同步更新左上角的logo-avatar
          const logoAvatar = document.querySelector('.logo-avatar');
          if (logoAvatar) {
              logoAvatar.src = finalAvatarUrl;
              
              // 添加使用者名稱和角色標籤
              const avatarInfo = document.createElement('div');
              avatarInfo.style.display = 'flex';
              avatarInfo.style.flexDirection = 'column';
              avatarInfo.style.marginLeft = '10px';
              
              const username = document.createElement('span');
              username.style.fontWeight = '600';
              username.style.color = '#e6eef8';
              username.textContent = payload.username;
              
              const roleBadge = document.createElement('span');
              roleBadge.className = 'user-role-badge';
              roleBadge.textContent = payload.role === 'admin' ? '管理員' : '使用者';
              
              avatarInfo.appendChild(username);
              avatarInfo.appendChild(roleBadge);
              logoAvatar.parentNode.insertBefore(avatarInfo, logoAvatar.nextSibling);
          }

                    // 點擊更換頭像功能
                    const avatarInput = document.createElement('input');
                    avatarInput.type = 'file';
                    avatarInput.accept = 'image/*';
                    avatarInput.style.display = 'none';
                    document.body.appendChild(avatarInput);

                    avatarImg.addEventListener('click', () => {
                        avatarInput.click();
                    });

                    avatarInput.addEventListener('change', async () => {
                        if (avatarInput.files.length === 0) return;
                        const file = avatarInput.files[0];
                        const formData = new FormData();
                        formData.append('avatar', file);

                        try {
                            const uploadRes = await fetch(`${BACKEND_URL}/api/auth/avatar`, {
                                method: 'POST',
                                headers: { 'Authorization': `Bearer ${token}` },
                                body: formData
                            });

                            if (uploadRes.ok) {
                                const uploadData = await uploadRes.json();
                                alert('頭像上傳成功！');
                                avatarImg.src = `${BACKEND_URL}/uploads/${uploadData.avatar}`;
                            } else {
                                const errMsg = await uploadRes.text();
                                alert(`更換頭像失敗: ${errMsg}`);
                            }
                        } catch (err) {
                            console.error('更換頭像錯誤:', err);
                            alert('更換頭像發生錯誤，請稍後再試。');
                        }
                    });

                    const avatarLi = document.createElement('li');
                    avatarLi.appendChild(avatarContainer);
                    navUl.appendChild(avatarLi);
                }

                if (payload && payload.username === 'Yinch') {
                    const adminLi = document.createElement('li');
                    const adminLink = document.createElement('a');
                    adminLink.href = 'admin.html';
                    adminLink.textContent = '管理後台';
                    adminLi.appendChild(adminLink);
                    navUl.appendChild(adminLi);
                }

                const logoutLi = document.createElement('li');
                const logoutBtn = document.createElement('a');
                logoutBtn.href = '#';
                logoutBtn.textContent = '登出';
                logoutBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    localStorage.removeItem('token');
                    alert('已成功登出！');
                    window.location.reload();
                });
                logoutLi.appendChild(logoutBtn);
                navUl.appendChild(logoutLi);
            }
        });
    </script>
</body>
</html>
