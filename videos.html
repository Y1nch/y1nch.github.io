<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影片 - Yinch 的作品集</title>
    <link rel="stylesheet" href="styles/main.css">
    <style>
        /* 1. 頂部導覽列同步首頁樣式 */
        header {
            background-color: #0b0f19; /* 貼合首頁的深藍黑底色 */
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #3b82f6;
        }

        .logo-text {
            color: #ffffff;
            font-weight: bold;
            font-size: 1.1rem;
            text-decoration: none;
        }

        .logo-sub {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-right: 6px;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 30px; /* 讓選單字體有舒服的間距 */
        }

        nav ul li a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s ease;
        }

        nav ul li a:hover,
        nav ul li a.active {
            color: #ffffff; /* 懸浮或作用中變亮白 */
        }

        /* 2. 頁面主體排版維持 */
        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
        }

        h2 {
            font-size: 1.6rem;
            margin-bottom: 20px;
            border-bottom: 2px solid #3b82f6;
            padding-bottom: 8px;
            color: #ffffff;
        }

        #upload-video {
            background-color: #111827; /* 微調深色卡片底色 */
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            margin-bottom: 40px;
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 8px;
            font-weight: 600;
            color: #94a3b8;
        }

        .form-group input[type="text"],
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #374151;
            border-radius: 6px;
            background-color: #1f2937;
            color: #ffffff;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .form-group input[type="text"]:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .form-group textarea {
            height: 100px;
            resize: vertical;
        }

        .file-input-wrapper {
            background-color: #1f2937;
            border: 1px dashed #4b5563;
            padding: 15px;
            border-radius: 6px;
        }

        .file-input-wrapper input[type="file"] {
            color: #94a3b8;
        }

        #video-upload-form button[type="submit"] {
            background-color: #3b82f6;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            width: 100%;
            margin-top: 10px;
        }

        #video-upload-form button[type="submit"]:hover {
            background-color: #2563eb;
        }

        #video-upload-form button[type="submit"]:active {
            transform: scale(0.98);
        }

        #videos-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        footer {
            text-align: center;
            padding: 40px 0;
            color: #4b5563;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-section">
            <img class="logo-avatar" src="https://github.com/Y1nch.png" alt="Avatar">
            <a href="index.html" class="logo-text"><span class="logo-sub">只是個人</span>@Yinch</a>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">關於我</a></li>
                <li><a href="index.html#games">遊戲清單</a></li> <li><a href="videos.html" class="active">影片</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="upload-video">
            <h2>上傳新影片</h2>
            <form id="video-upload-form" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="video-title">影片標題</label>
                    <input type="text" id="video-title" name="title" placeholder="請輸入影片標題..." required>
                </div>

                <div class="form-group">
                    <label for="video-description">影片描述</label>
                    <textarea id="video-description" name="description" placeholder="請輸入影片的詳細描述..."></textarea>
                </div>

                <div class="form-group">
                    <label for="video-file">選擇影片檔案</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="video-file" name="video" accept="video/*" required>
                    </div>
                </div>

                <button type="submit">確認上傳影片</button>
            </form>
        </section>

        <section id="video-list">
            <h2>已上傳影片</h2>
            <div id="videos-container">
                </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Yinch 的作品集</p>
    </footer>

    <script src="scripts/videos.js"></script>
</body>
</html>
