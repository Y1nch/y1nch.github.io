<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影片圖像分享</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
    <style>
        /* 讓導覽列清單變成水平排列 */
        #navLinksList {
            display: flex;
            flex-direction: row;
            gap: 20px;
            list-style: none;
            margin: 0;
            padding: 0;
            align-items: center;
        }

        .user-role-badge {
            font-size: 0.7rem;
            color: #94a3b8;
            margin-bottom: 2px;
        }
        
        .site-header.scrolled #brandTextZone {
            display: flex !important;
            flex-direction: column !important;
        }

        /* ✨ 影片上傳與展示區域 - 優化留白機制 */
        .video-container {
            max-width: 1200px;
            margin: 40px auto 0 auto; /* 移除原本的下方外距 */
            padding: 0 20px 80px 20px; /* 💡 關鍵：在底部加入 80px 的內距，確保滑到底部時有完美的留白空間 */
        }

        .upload-section {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .upload-section h2 {
            margin-top: 0;
            margin-bottom: 16px;
            color: #ffffff;
            font-size: 1.5rem;
        }

        .upload-type-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .tab-btn {
            background: transparent;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: #3b82f6;
            color: #ffffff;
            border-color: #3b82f6;
        }

        .upload-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .form-group input[type="text"],
        .form-group input[type="file"] {
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            padding: 10px;
            color: #ffffff;
            font-family: inherit;
        }

        .upload-btn {
            background: #3b82f6;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .upload-btn:hover {
            background: #2563eb;
        }

        /* 媒體卡片網格 */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        /* 精美媒體卡片樣式 */
        .media-card {
            position: relative;
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .media-card:hover {
            transform: translateY(-5px);
            border-color: #3b82f6;
        }

        .media-preview-zone {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 比例 */
            background: #0f172a;
        }

        .media-preview-zone video,
        .media-preview-zone img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 讓圖片游標變成放大鏡，暗示可以點擊 */
        .media-preview-zone img {
            cursor: zoom-in;
            transition: opacity 0.2s;
        }
        .media-preview-zone img:hover {
            opacity: 0.9;
        }

        .media-info-zone {
            padding: 20px;
        }

        .media-card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
            margin: 0 0 12px 0;
            line-height: 1.4;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .media-meta-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: #94a3b8;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 12px;
        }

        .media-author {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #cbd5e1;
            font-weight: 500;
        }

        /* 🗑️ 管理員/Yinch 專屬刪除按鈕 */
        .delete-media-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 10;
            background: rgba(239, 68, 68, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            transition: background 0.2s, transform 0.2s;
        }
        .delete-media-btn:hover {
            background: #ef4444;
            transform: scale(1.1);
        }

        /* 🔍 圖片放大燈箱 (Lightbox Modal) */
        .image-lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .image-lightbox.active {
            opacity: 1;
            pointer-events: auto;
        }
        .lightbox-content {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 8px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .image-lightbox.active .lightbox-content {
            transform: scale(1);
        }
        .lightbox-close-tip {
            position: absolute;
            bottom: 30px;
            color: #94a3b8;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        /* 滾動動畫特效 */
        .animate-on-scroll {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1), transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .animate-on-scroll.appear {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <header class="site-header" id="siteHeader">
        <div class="container header-inner">
            <div class="brand" id="headerBrand">
                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Guest" alt="Logo" class="logo-avatar" id="mainLogoImg" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover;">
                <div class="brand-text" id="brandTextZone" style="margin-left: 12px;">
                    <p class="user-role-badge" style="margin: 0;">歡迎光臨</p>
                    <h1 class="site-title" style="font-size: 1.3rem; margin: 0;">訪客</h1>
                </div>
            </div>
            <nav class="site-nav">
                <ul id="navLinksList">
                    <li><a href="index.html">首頁</a></li>
                    <li><a href="videos.html" class="active">影片</a></li>
                    <li><a href="login.html" id="navLoginBtn">登入</a></li>
                    <li><a href="register.html" id="navRegisterBtn">註冊</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="video-container">
        <section class="upload-section" id="uploadSection" style="display: none;">
            <h2>上傳全新遊戲精華</h2>
            <div class="upload-type-tabs">
                <button type="button" class="tab-btn active" id="tabVideo" onclick="switchUploadType('video')">🎬 影片上傳</button>
                <button type="button" class="tab-btn" id="tabImage" onclick="switchUploadType('image')">🖼️ 圖片上傳</button>
            </div>
            <form class="upload-form" id="mediaUploadForm">
                <input type="hidden" id="uploadType" value="video">
                <div class="form-group">
                    <label id="titleLabel" for="mediaTitle">影片標題</label>
                    <input type="text" id="mediaTitle" placeholder="請輸入吸睛的影片標題..." required>
                </div>
                <div class="form-group">
                    <label id="fileLabel" for="mediaFile">選擇影片檔案</label>
                    <input type="file" id="mediaFile" accept="video/*" required>
                </div>
                <button type="submit" class="upload-btn" id="submitBtn">開始上傳影片</button>
            </form>
        </section>

        <section style="margin-bottom: 20px;">
            <h2 style="color: #ffffff; font-size: 1.8rem; margin-bottom: 20px;">熱門玩家精華分享</h2>
            <div class="video-grid" id="videoGrid">
                <div style="color: #94a3b8; grid-column: 1/-1; text-align: center; padding: 40px;">
                    媒體檔案載入中，請稍候...
                </div>
            </div>
        </section>
    </main>

    <div class="image-lightbox" id="imageLightbox">
        <img src="" alt="放大圖" class="lightbox-content" id="lightboxImg">
        <div class="lightbox-close-tip">點擊任何地方關閉</div>
    </div>

    <script>
        function switchUploadType(type) {
            const uploadTypeInput = document.getElementById('uploadType');
            const tabVideo = document.getElementById('tabVideo');
            const tabImage = document.getElementById('tabImage');
            const titleLabel = document.getElementById('titleLabel');
            const mediaTitle = document.getElementById('mediaTitle');
            const fileLabel = document.getElementById('fileLabel');
            const mediaFile = document.getElementById('mediaFile');
            const submitBtn = document.getElementById('submitBtn');

            uploadTypeInput.value = type;
            mediaFile.value = '';

            if (type === 'video') {
                tabVideo.classList.add('active');
                tabImage.classList.remove('active');
                titleLabel.textContent = '影片標題';
                mediaTitle.placeholder = '請輸入吸睛的影片標題...';
                fileLabel.textContent = '選擇影片檔案';
                mediaFile.accept = 'video/*';
                submitBtn.textContent = '開始上傳影片';
            } else {
                tabImage.classList.add('active');
                tabVideo.classList.remove('active');
                titleLabel.textContent = '圖片名稱 / 描述';
                mediaTitle.placeholder = '請輸入圖片名稱或精彩敘述...';
                fileLabel.textContent = '選擇圖片檔案';
                mediaFile.accept = 'image/*';
                submitBtn.textContent = '開始上傳圖片';
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('token');
            const navUl = document.getElementById('navLinksList');
            const siteHeader = document.getElementById('siteHeader');
            const mainLogoImg = document.getElementById('mainLogoImg');
            const brandTextZone = document.getElementById('brandTextZone');
            const videoGrid = document.getElementById('videoGrid');
            
            const imageLightbox = document.getElementById('imageLightbox');
            const lightboxImg = document.getElementById('lightboxImg');
            
            const BACKEND_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
                ? 'http://localhost:3000'
                : 'https://y1nchgithubio-production.up.railway.app';
            
            let isUserLoggedIn = false;
            let userData = { username: '訪客', role: 'guest', avatar: 'https://api.dicebear.com/7.x/bottts/svg?seed=Guest' };

            function parseJwt(token) {
                try {
                    const base64Url = token.split('.')[1];
                    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                    const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
                    return JSON.parse(jsonPayload);
                } catch (e) { return null; }
            }

            const payload = token ? parseJwt(token) : null;
            if (payload && payload.username) {
                isUserLoggedIn = true;
                userData.username = payload.username;
                userData.role = payload.role;
            }

            window.addEventListener('scroll', () => {
                if (window.scrollY > 50) {
                    siteHeader.classList.add('scrolled');
                    mainLogoImg.src = "assets/profile.jpg";
                    brandTextZone.innerHTML = `
                        <p class="user-role-badge" style="margin: 0;">網頁創作者</p>
                        <h1 class="site-title" style="font-size: 1.3rem; margin: 0;">Yinch</h1>
                    `;
                } else {
                    siteHeader.classList.remove('scrolled');
                    renderBrandZone();
                }
            });

            function renderBrandZone() {
                mainLogoImg.src = userData.avatar;
                if (isUserLoggedIn) {
                    const userRoleText = userData.username === 'Yinch' ? '伺服器/網頁代理' : (userData.role === 'admin' ? '管理員' : '使用者');
                    brandTextZone.innerHTML = `
                        <p class="user-role-badge" style="margin: 0;">${userRoleText}</p>
                        <h1 class="site-title" style="font-size: 1.3rem; margin: 0;">@${userData.username}</h1>
                    `;
                    mainLogoImg.style.border = '2px solid #3b82f6';
                } else {
                    brandTextZone.innerHTML = `
                        <p class="user-role-badge" style="margin: 0;">歡迎光臨</p>
                        <h1 class="site-title" style="font-size: 1.3rem; margin: 0;">訪客</h1>
                    `;
                    mainLogoImg.style.border = 'none';
                }
            }

            function formatCustomDate(dateString) {
                if (!dateString) return '未知時間';
                const d = new Date(dateString);
                return `${d.getFullYear()}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getDate().toString().padStart(2,'0')}`;
            }

            async function deleteMedia(id, type) {
                if (!confirm(`確定要刪除此部${type === 'video' ? '影片' : '圖片'}嗎？此操作無法還原。`)) return;
                
                const endpoint = type === 'video' ? `${BACKEND_URL}/api/videos/${id}` : `${BACKEND_URL}/api/images/${id}`;
                try {
                    const res = await fetch(endpoint, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.ok) {
                        alert('刪除成功！');
                        window.location.reload();
                    } else {
                        alert('刪除失敗，請檢查權限。');
                    }
                } catch (error) {
                    console.error('刪除請求出錯:', error);
                    alert('無法連線到伺服器。');
                }
            }

            async function fetchAndRenderMedia() {
                try {
                    const [videosRes, imagesRes] = await Promise.all([
                        fetch(`${BACKEND_URL}/api/videos`).catch(() => null),
                        fetch(`${BACKEND_URL}/api/images`).catch(() => null)
                    ]);

                    let allMedia = [];

                    if (videosRes && videosRes.ok) {
                        const videos = await videosRes.json();
                        allMedia = allMedia.concat(videos.map(v => ({ ...v, mediaType: 'video' })));
                    }
                    if (imagesRes && imagesRes.ok) {
                        const images = await imagesRes.json();
                        allMedia = allMedia.concat(images.map(i => ({ ...i, mediaType: 'image' })));
                    }

                    allMedia.sort((a, b) => new Date(b.createdAt || b.uploadedAt) - new Date(a.createdAt || a.uploadedAt));

                    if (allMedia.length === 0) {
                        videoGrid.innerHTML = `
                            <div style="color: #ef4444; font-weight: 600; font-size: 1.2rem; grid-column: 1/-1; text-align: center; padding: 60px; border: 2px dashed rgba(239, 68, 68, 0.3); border-radius: 12px; background: rgba(239, 68, 68, 0.05);">
                                ⚠️ 目前沒有影片與圖片！
                            </div>
                        `;
                        return;
                    }

                    videoGrid.innerHTML = '';
                    const hasManagePermission = userData.username === 'Yinch' || userData.role === 'admin';

                    allMedia.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'media-card animate-on-scroll';

                        const authorName = item.user?.username || item.username || '神秘玩家';
                        const timeStamp = item.createdAt || item.uploadedAt;
                        const mediaId = item._id || item.id;
                        const fileUrl = `${BACKEND_URL}/uploads/${item.filename || item.url}`;
                        
                        let previewHTML = '';
                        if (item.mediaType === 'video') {
                            previewHTML = `<video src="${fileUrl}" controls preload="metadata"></video>`;
                        } else {
                            previewHTML = `<img src="${fileUrl}" alt="${item.title || '圖片'}" class="clickable-img">`;
                        }

                        let deleteBtnHTML = '';
                        if (hasManagePermission && mediaId) {
                            deleteBtnHTML = `<button class="delete-media-btn" title="刪除此內容">🗑️</button>`;
                        }

                        card.innerHTML = `
                            ${deleteBtnHTML}
                            <div class="media-preview-zone">
                                ${previewHTML}
                            </div>
                            <div class="media-info-zone">
                                <h3 class="media-card-title">${item.title || '未命名精華'}</h3>
                                <div class="media-meta-line">
                                    <span class="media-author">👤 ${authorName}</span>
                                    <span>📅 ${formatCustomDate(timeStamp)}</span>
                                </div>
                            </div>
                        `;

                        const delBtn = card.querySelector('.delete-media-btn');
                        if (delBtn) {
                            delBtn.addEventListener('click', (e) => {
                                e.stopPropagation();
                                deleteMedia(mediaId, item.mediaType);
                            });
                        }

                        if (item.mediaType === 'image') {
                            const imgEl = card.querySelector('.clickable-img');
                            if (imgEl) {
                                imgEl.addEventListener('click', () => {
                                    lightboxImg.src = fileUrl;
                                    imageLightbox.classList.add('active');
                                });
                            }
                        }

                        videoGrid.appendChild(card);
                    });

                    initScrollAnimation();

                } catch (error) {
                    console.error('載入媒體失敗:', error);
                    videoGrid.innerHTML = `<div style="color: #ef4444; grid-column: 1/-1; text-align: center; padding: 40px;">伺服器連線失敗，無法載入內容。</div>`;
                }
            }

            imageLightbox.addEventListener('click', () => {
                imageLightbox.classList.remove('active');
                setTimeout(() => { lightboxImg.src = ''; }, 300);
            });

            function initScrollAnimation() {
                const elements = document.querySelectorAll('.animate-on-scroll');
                const observer = new IntersectionObserver((entries, obs) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('appear');
                            obs.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.1 });
                elements.forEach(el => observer.observe(el));
            }

            await fetchAndRenderMedia();

            if (token && navUl) {
                const loginBtn = document.getElementById('navLoginBtn');
                const registerBtn = document.getElementById('navRegisterBtn');
                if (loginBtn) loginBtn.closest('li').remove();
                if (registerBtn) registerBtn.closest('li').remove();

                const uploadSection = document.getElementById('uploadSection');
                if (uploadSection) uploadSection.style.display = 'block';

                try {
                    const profileRes = await fetch(`${BACKEND_URL}/api/auth/profile`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (profileRes.ok) {
                        const profileData = await profileRes.json();
                        if (profileData.avatar) {
                            userData.avatar = `${BACKEND_URL}/uploads/${profileData.avatar}`;
                        }
                    }
                } catch (err) { console.error(err); }

                renderBrandZone();

                const avatarInput = document.createElement('input');
                avatarInput.type = 'file';
                avatarInput.accept = 'image/*';
                avatarInput.style.display = 'none';
                document.body.appendChild(avatarInput);

                mainLogoImg.addEventListener('click', () => {
                    if (!siteHeader.classList.contains('scrolled')) avatarInput.click();
                });

                avatarInput.addEventListener('change', async () => {
                    if (avatarInput.files.length === 0) return;
                    const formData = new FormData();
                    formData.append('avatar', avatarInput.files[0]);

                    try {
                        const uploadRes = await fetch(`${BACKEND_URL}/api/auth/avatar`, {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${token}` },
                            body: formData
                        });
                        if (uploadRes.ok) {
                            const uploadData = await uploadRes.json();
                            alert('頭像上傳成功！');
                            userData.avatar = `${BACKEND_URL}/uploads/${uploadData.avatar}`;
                            renderBrandZone();
                        }
                    } catch (err) { console.error(err); }
                });

                const mediaForm = document.getElementById('mediaUploadForm');
                if (mediaForm) {
                    mediaForm.addEventListener('submit', async (e) => {
                        e.preventDefault();
                        const uploadType = document.getElementById('uploadType').value;
                        const title = document.getElementById('mediaTitle').value;
                        const fileField = document.getElementById('mediaFile');
                        
                        if (fileField.files.length === 0) return;
                        const file = fileField.files[0];
                        const formData = new FormData();
                        formData.append('title', title);
                        
                        let apiEndpoint = `${BACKEND_URL}/api/videos/upload`;
                        if (uploadType === 'video') {
                            formData.append('video', file);
                        } else {
                            formData.append('image', file);
                            apiEndpoint = `${BACKEND_URL}/api/images/upload`;
                        }

                        try {
                            const res = await fetch(apiEndpoint, {
                                method: 'POST',
                                headers: { 'Authorization': `Bearer ${token}` },
                                body: formData
                            });
                            if (res.ok) {
                                alert(`${uploadType === 'video' ? '影片' : '圖片'}上傳成功！`);
                                window.location.reload();
                            } else {
                                alert('上傳失敗');
                            }
                        } catch (err) { console.error(err); }
                    });
                }

                if (userData.username === 'Yinch') {
                    const adminLi = document.createElement('li');
                    const adminLink = document.createElement('a');
                    adminLink.href = 'admin.html';
                    adminLink.textContent = '管理後台';
                    adminLi.appendChild(adminLink);
                    navUl.appendChild(adminLi);
                }

                const logoutLi = document.createElement('li');
                const logoutBtn = document.createElement('a');
                logoutBtn.href = '#';
                logoutBtn.textContent = '登出';
                logoutBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    localStorage.removeItem('token');
                    alert('已成功登出！');
                    window.location.reload();
                });
                logoutLi.appendChild(logoutBtn);
                navUl.appendChild(logoutLi);
            } else {
                renderBrandZone();
            }
        });
    </script>
</body>
</html>
