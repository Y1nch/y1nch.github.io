<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影片</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">首頁</a></li>
                <li><a href="videos.html">影片</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="upload-video">
            <h2>上傳新影片</h2>
            <form id="video-upload-form" enctype="multipart/form-data">
                <label for="video-title">標題:</label>
                <input type="text" id="video-title" name="title" required><br><br>

                <label for="video-description">描述:</label>
                <textarea id="video-description" name="description"></textarea><br><br>

                <label for="video-file">影片檔案:</label>
                <input type="file" id="video-file" name="video" accept="video/*" required><br><br>

                <button type="submit">上傳影片</button>
            </form>
        </section>

        <section id="video-list">
            <h2>已上傳影片</h2>
            <div id="videos-container">
                <!-- Videos will be loaded here by JavaScript -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Yinch 的作品集</p>
    </footer>

    <script src="scripts/videos.js"></script>
</body>
</html>
