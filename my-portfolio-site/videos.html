<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的影片庫</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <div class="brand">
                <div class="logo-circle">G</div>
                <div class="brand-text">
                    <p class="eyebrow">遊戲玩家</p>
                    <h1 class="site-title">我的影片庫</h1>
                </div>
            </div>
            <nav class="site-nav">
                <a href="index.html">首頁</a>
                <a href="#upload">上傳影片</a>
            </nav>
        </div>
    </header>

    <main class="section-block video-page">
        <div class="container">
            <section id="upload" class="section-heading">
                <h2>上傳並收藏你的遊戲影片（僅本機）</h2>
                <p>使用此頁面上傳你錄好的影片，會儲存在瀏覽器的 IndexedDB（僅於此裝置與瀏覽器可見）。</p>
                <div class="upload-controls">
                    <input type="file" id="videoFile" accept="video/*">
                    <input type="text" id="videoTitle" placeholder="影片標題（選填）">
                    <button id="uploadBtn" class="btn btn-primary">上傳並儲存</button>
                </div>
            </section>

            <section class="section-block">
                <h2>我的影片</h2>
                <div id="videoList" class="video-list"></div>
                <div id="playerWrapper" class="player-wrapper" style="display:none">
                    <video id="player" controls width="100%"></video>
                    <div class="player-meta" id="playerMeta"></div>
                </div>
            </section>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>© 2024 遊戲玩家個人頁. 版權所有。</p>
        </div>
    </footer>

    <script src="scripts/videos.js"></script>
</body>
</html>
