<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遊戲精華分享</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <div class="brand">
                <img src="assets/profile.jpg" alt="Yinch" class="logo-img">
                <div class="brand-text">
                    <p class="eyebrow">伺服器/網頁代理人</p>
                    <h1 class="site-title">@Yinch</h1>
                </div>
            </div>
            <nav class="site-nav">
                <a href="#about">關於網頁</a>
                <a href="videos.html">影片</a>
                <a href="login.html" class="nav-auth-btn">登入</a>
                <a href="register.html" class="nav-auth-btn">註冊</a>
            </nav>
        </div>
    </header>

    <section id="hero" class="hero-section">
        <div class="container hero-content">
            <div class="hero-copy">
                <p class="hero-subtitle">FPS、開放世界、大逃殺、策略</p>
                <h2 class="hero-title">分享影片與截圖</h2>
                <p class="hero-desc">遊戲畫面收藏、紀念。</p>
                <div class="hero-actions">
                    <a href="videos.html" class="btn btn-primary">前往影片</a>
                </div>
            </div>
            <aside class="hero-aside">
                <div class="discord-profile">
                    <div class="avatar" style="background-image: url('assets/profile.jpg')"></div>
                    <div class="discord-body">
                        <div class="discord-header">
                            <h3 class="discord-username">Smol Y <span class="discriminator">#Yinch</span></h3>
                            <span class="status online" title="線上"></span>
                        </div>
                        <p class="discord-bio">嘗試寫出一個可以分享的網站、順便學習對網頁或API的應用。</p>
                        <div class="discord-tags">
                            <span class="tag">戰術協作</span>
                            <span class="tag">操肝人士</span>
                            <span class="tag">開放世界</span>
                        </div>
                        <div class="discord-stats">
                            <div>
                                <strong>上線時間</strong>
                                <p>假日整天 / 平日晚上</p>
                            </div>
                            <div>
                                <strong>不開放好友申請</strong>
                                <p>日後會再嘗試開發DC群組讓各位加入</p>
                            </div>
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </section>

    <main>
        <section id="about" class="section-block">
            <div class="container section-grid">
                <div class="section-text">
                    <h2>關於網站</h2>
                    <p>主要讓使用者可以放上影片/圖片可以觀賞。</p>
                    <div class="skill-list">
                        <span>戰術協作</span>
                        <span>技術台</span>
                        <span>分享操作</span>
                        <span>社群互動</span>
                    </div>
                </div>
                <div class="about-cards">
                    <article class="info-card">
                        <h3>遊戲時間</h3>
                        <p>通常假日會整天玩，平日則以晚上為主。</p>
                    </article>
                    <article class="info-card">
                        <h3>遊戲風格</h3>
                        <p>偏好策略與團隊合作，節奏偏快。</p>
                    </article>
                </div>
            </div>
        </section>


        <!-- stats and contact removed: site is now read-only and for browsing only -->
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <p>© 2026 精華分享網頁 </p>
        </div>
    </footer>

    <!-- Game preview modal -->
    <div id="gameModal" class="modal" aria-hidden="true">
        <div class="modal-inner">
            <button class="modal-close" aria-label="關閉">關閉</button>
            <img id="modalImage" src="" alt="遊戲畫面">
            <div class="modal-caption" id="modalCaption"></div>
        </div>
    </div>

    <script src="scripts/main.js"></script>
    <script>
        // 登出與狀態切換邏輯
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('token');
            const nav = document.querySelector('.site-nav');
            const BACKEND_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
                ? 'http://localhost:3000'
                : 'https://y1nchgithubio-production.up.railway.app';
            
            function parseJwt(token) {
                try {
                    const base64Url = token.split('.')[1];
                    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                    const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                    }).join(''));
                    return JSON.parse(jsonPayload);
                } catch (e) {
                    return null;
                }
            }

            if (token && nav) {
                // 已登入：移除「登入」「註冊」，並加入頭像與「登出」按鈕
                const loginBtn = nav.querySelector('a[href="login.html"]');
                const registerBtn = nav.querySelector('a[href="register.html"]');
                if (loginBtn) loginBtn.remove();
                if (registerBtn) registerBtn.remove();
                
                const payload = parseJwt(token);
                if (payload && payload.username) {
                    const avatarImg = document.createElement('img');
                    avatarImg.alt = payload.username;
                    avatarImg.title = `${payload.username} (點擊可上傳/更換頭像)`;
                    avatarImg.style.width = '32px';
                    avatarImg.style.height = '32px';
                    avatarImg.style.borderRadius = '50%';
                    avatarImg.style.border = '2px solid #3b82f6';
                    avatarImg.style.verticalAlign = 'middle';
                    avatarImg.style.marginLeft = '18px';
                    avatarImg.style.cursor = 'pointer';
                    avatarImg.style.transition = 'transform 0.2s';
                    avatarImg.onmouseover = () => avatarImg.style.transform = 'scale(1.15)';
                    avatarImg.onmouseout = () => avatarImg.style.transform = 'scale(1)';
                    
                    // 獲取最新 Profile 頭像
                    let finalAvatarUrl = `https://api.dicebear.com/7.x/pixel-art/svg?seed=${encodeURIComponent(payload.username)}`;
                    try {
                        const profileRes = await fetch(`${BACKEND_URL}/api/auth/profile`, {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        if (profileRes.ok) {
                            const profileData = await profileRes.json();
                            if (profileData.avatar) {
                                finalAvatarUrl = `${BACKEND_URL}/uploads/${profileData.avatar}`;
                            }
                        }
                    } catch (err) {
                        console.error('獲取頭像失敗，使用預設頭像:', err);
                    }
                    avatarImg.src = finalAvatarUrl;

                    // 同步更新左上角的 logo-img
                    const logoImg = document.querySelector('.logo-img');
                    if (logoImg) {
                        logoImg.src = finalAvatarUrl;
                    }

                    // 點擊更換頭像功能
                    const avatarInput = document.createElement('input');
                    avatarInput.type = 'file';
                    avatarInput.accept = 'image/*';
                    avatarInput.style.display = 'none';
                    document.body.appendChild(avatarInput);

                    avatarImg.addEventListener('click', () => {
                        avatarInput.click();
                    });

                    avatarInput.addEventListener('change', async () => {
                        if (avatarInput.files.length === 0) return;
                        const file = avatarInput.files[0];
                        const formData = new FormData();
                        formData.append('avatar', file);

                        try {
                            const uploadRes = await fetch(`${BACKEND_URL}/api/auth/avatar`, {
                                method: 'POST',
                                headers: { 'Authorization': `Bearer ${token}` },
                                body: formData
                            });

                            if (uploadRes.ok) {
                                const uploadData = await uploadRes.json();
                                alert('頭像上傳成功！');
                                avatarImg.src = `${BACKEND_URL}/uploads/${uploadData.avatar}`;
                            } else {
                                const errMsg = await uploadRes.text();
                                alert(`更換頭像失敗: ${errMsg}`);
                            }
                        } catch (err) {
                            console.error('更換頭像錯誤:', err);
                            alert('更換頭像發生錯誤，請稍後再試。');
                        }
                    });

                    nav.appendChild(avatarImg);
                }

                if (payload && payload.username === 'Yinch') {
                    const adminLink = document.createElement('a');
                    adminLink.href = 'admin.html';
                    adminLink.className = 'nav-auth-btn';
                    adminLink.textContent = '管理後台';
                    nav.appendChild(adminLink);
                }

                const logoutBtn = document.createElement('a');
                logoutBtn.href = '#';
                logoutBtn.className = 'nav-auth-btn';
                logoutBtn.textContent = '登出';
                logoutBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    localStorage.removeItem('token');
                    alert('已成功登出！');
                    window.location.reload();
                });
                nav.appendChild(logoutBtn);
            }
        });
    </script>
</body>
</html>
