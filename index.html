<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遊戲精華分享</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
    <style>
        .user-role-badge {
            font-size: 0.7rem;
            color: #94a3b8;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <div class="brand">
                <img src="assets/profile.jpg" alt="Yinch" class="logo-img">
                <div class="brand-text">
                    <p class="eyebrow">伺服器/網頁代理人</p>
                    <h1 class="site-title">@Yinch</h1>
                    <div class="user-info" style="margin-top: 8px;">
                        <img src="https://github.com/Y1nch.png" alt="Avatar" class="logo-img" style="width: 32px; height: 32px; border-radius: 50%; border: 2px solid #3b82f6;">
                        <div style="margin-left: 8px;">
                            <span style="font-size: 0.9rem; font-weight: 600;">Yinch</span>
                            <span style="font-size: 0.7rem; color: #94a3b8;">管理員</span>
                        </div>
                    </div>
                </div>
            </div>
            <nav class="site-nav">
                <a href="#about">關於網頁</a>
                <a href="videos.html">影片</a>
                <a href="login.html" class="nav-auth-btn">登入</a>
                <a href="register.html" class="nav-auth-btn">註冊</a>
            </nav>
        </div>
    </header>

    <main>
        <!-- 其他內容保持不變 -->
    </main>

    <script src="scripts/main.js"></script>
    <script>
        // 登出與狀態切換邏輯
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('token');
            const nav = document.querySelector('.site-nav');
            const BACKEND_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
                ? 'http://localhost:3000'
                : 'https://y1nchgithubio-production.up.railway.app';
            
            function parseJwt(token) {
                try {
                    const base64Url = token.split('.')[1];
                    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                    const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                    }).join(''));
                    return JSON.parse(jsonPayload);
                } catch (e) {
                    return null;
                }
            }

            if (token && nav) {
                // 已登入：移除「登入」「註冊」，並加入頭像與「登出」按鈕
                const loginBtn = nav.querySelector('a[href="login.html"]');
                const registerBtn = nav.querySelector('a[href="register.html"]');
                if (loginBtn) loginBtn.remove();
                if (registerBtn) registerBtn.remove();
                
                const payload = parseJwt(token);
                if (payload && payload.username) {
                    const avatarContainer = document.createElement('div');
                    avatarContainer.style.display = 'flex';
                    avatarContainer.style.alignItems = 'center';
                    avatarContainer.style.gap = '10px';
                    
                    const avatarImg = document.createElement('img');
                    avatarImg.alt = payload.username;
                    avatarImg.title = `${payload.username} (點擊可上傳/更換頭像)`;
                    avatarImg.style.width = '32px';
                    avatarImg.style.height = '32px';
                    avatarImg.style.borderRadius = '50%';
                    avatarImg.style.border = '2px solid #3b82f6';
                    avatarImg.style.cursor = 'pointer';
                    avatarImg.style.transition = 'transform 0.2s';
                    avatarImg.onmouseover = () => avatarImg.style.transform = 'scale(1.15)';
                    avatarImg.onmouseout = () => avatarImg.style.transform = 'scale(1)';
                    
                    const userInfo = document.createElement('div');
                    userInfo.style.display = 'flex';
                    userInfo.style.flexDirection = 'column';
                    
                    const roleBadge = document.createElement('span');
                    roleBadge.className = 'user-role-badge';
                    roleBadge.textContent = payload.role === 'admin' ? '管理員' : '使用者';
                    
                    const usernameText = document.createElement('span');
                    usernameText.style.fontWeight = '600';
                    usernameText.textContent = payload.username;
                    
                    userInfo.appendChild(roleBadge);
                    userInfo.appendChild(usernameText);
                    avatarContainer.appendChild(avatarImg);
                    avatarContainer.appendChild(userInfo);

                    // 獲取最新 Profile 頭像
                    let finalAvatarUrl = `https://api.dicebear.com/7.x/pixel-art/svg?seed=${encodeURIComponent(payload.username)}`;
                    try {
                        const profileRes = await fetch(`${BACKEND_URL}/api/auth/profile`, {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        if (profileRes.ok) {
                            const profileData = await profileRes.json();
                            if (profileData.avatar) {
                                finalAvatarUrl = `${BACKEND_URL}/uploads/${profileData.avatar}`;
                            }
                        }
                    } catch (err) {
                        console.error('獲取頭像失敗，使用預設頭像:', err);
                    }
                    avatarImg.src = finalAvatarUrl;

                    // 同步更新左上角的 logo-img
                    const logoImg = document.querySelector('.logo-img');
                    if (logoImg) {
                        logoImg.src = finalAvatarUrl;
                    }

                    // 點擊更換頭像功能
                    const avatarInput = document.createElement('input');
                    avatarInput.type = 'file';
                    avatarInput.accept = 'image/*';
                    avatarInput.style.display = 'none';
                    document.body.appendChild(avatarInput);

                    avatarImg.addEventListener('click', () => {
                        avatarInput.click();
                    });

                    avatarInput.addEventListener('change', async () => {
                        if (avatarInput.files.length === 0) return;
                        const file = avatarInput.files[0];
                        const formData = new FormData();
                        formData.append('avatar', file);

                        try {
                            const uploadRes = await fetch(`${BACKEND_URL}/api/auth/avatar`, {
                                method: 'POST',
                                headers: { 'Authorization': `Bearer ${token}` },
                                body: formData
                            });

                            if (uploadRes.ok) {
                                const uploadData = await uploadRes.json();
                                alert('頭像上傳成功！');
                                avatarImg.src = `${BACKEND_URL}/uploads/${uploadData.avatar}`;
                            } else {
                                const errMsg = await uploadRes.text();
                                alert(`更換頭像失敗: ${errMsg}`);
                            }
                        } catch (err) {
                            console.error('更換頭像錯誤:', err);
                            alert('更換頭像發生錯誤，請稍後再試。');
                        }
                    });

                    avatarContainer.addEventListener('mouseenter', () => {
                        avatarImg.style.transform = 'scale(1.15)';
                    });

                    avatarContainer.addEventListener('mouseleave', () => {
                        avatarImg.style.transform = 'scale(1)';
                    });

                    nav.appendChild(avatarContainer);
                }

                if (payload && payload.username === 'Yinch') {
                    const adminLink = document.createElement('a');
                    adminLink.href = 'admin.html';
                    adminLink.className = 'nav-auth-btn';
                    adminLink.textContent = '管理後台';
                    nav.appendChild(adminLink);
                }

                const logoutBtn = document.createElement('a');
                logoutBtn.href = '#';
                logoutBtn.className = 'nav-auth-btn';
                logoutBtn.textContent = '登出';
                logoutBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    localStorage.removeItem('token');
                    alert('已成功登出！');
                    window.location.reload();
                });
                nav.appendChild(logoutBtn);
            }
        });
    </script>
</body>
</html>
